<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKEIN · {{PROJ}}</title>

  <!-- T1 设计系统基底 (16 色硬 token + 布局原语 + 动效); 早加载避免 FOUC -->
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../design.css">

  <!-- Tailwind CDN (buildless, 同 examples L7 范式); 内联 config 把品牌色别名指 tokens.css CSS 变量 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="skein-dark"]'],
      theme: {
        extend: {
          colors: {
            // ponytail: 直接读 tokens.css 变量, 单一源头; 不在 tailwind 这层再硬编码 hex。
            ocean:      { foam: 'var(--ocean-foam)', shallow: 'var(--ocean-shallow)', mid: 'var(--ocean-mid)', deep: 'var(--ocean-deep)', abyss: 'var(--ocean-abyss)' },
            whiteSand:  { pearl: 'var(--whiteSand-pearl)', shell: 'var(--whiteSand-shell)', cream: 'var(--whiteSand-cream)' },
            goldSand:   { light: 'var(--goldSand-light)', mid: 'var(--goldSand-mid)', deep: 'var(--goldSand-deep)', sunset: 'var(--goldSand-sunset)' },
            night:      { base: 'var(--night-base)', mid: 'var(--night-mid)', deep: 'var(--night-deep)' },
            success: 'var(--success)',
            warning: 'var(--warning)',
            danger:  'var(--danger)',
            // 派生语义 (page 直接 bg-card / text-fg / border-brd 即可)
            bg:      'var(--bg)',
            card:    'var(--card)',
            fg:      'var(--fg)',
            head:    'var(--head)',
            muted:   'var(--muted)',
            brd:     'var(--brd)',
            line:    'var(--line)',
            accent:  'var(--accent)',
            accent2: 'var(--accent2)',
            // 状态色 (--st-*)
            'st-pending': 'var(--st-pending)',
            'st-active':  'var(--st-active)',
            'st-check':   'var(--st-check)',
            'st-done':    'var(--st-done)',
            'st-failed':  'var(--st-failed)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
            mono: ['ui-monospace', 'SF Mono', 'JetBrains Mono', 'monospace'],
          },
          borderRadius: { DEFAULT: 'var(--radius)', sm: 'var(--radius-sm)', lg: 'var(--radius-lg)' },
        },
      },
    };
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      /* 兜底: design.css 已有 .glass, 这里给 page 内联组合用 */
      .glass-card { @apply glass rounded-lg p-4; }
    }
  </style>
</head>
<body class="bg-fluid-light min-h-screen font-sans text-fg">
  <!-- ponytail: 暗模自动切 bg-fluid-dark; design.css 已配 [data-theme="skein-dark"] -->
  <script>
    // 早同步主题 (避免闪屏): localStorage > prefers-color-scheme
    (function () {
      try {
        var pref = localStorage.getItem('skein-theme');
        if (pref === 'dark') document.documentElement.setAttribute('data-theme', 'skein-dark');
        else if (pref === 'light') document.documentElement.setAttribute('data-theme', 'skein-light');
      } catch (_) {}
    })();
  </script>

  <!-- 顶栏 (A 皮: 玻璃横梁; C 骨: logo + nav 6 页 tab + search + theme toggle)
       hx-push-url: nav a[href] 由 router.js 拦截 pushState (不引 htmx 库, 真"原生 DOM") -->
  <header class="topbar sticky top-0 z-float glass border-b border-brd">
    <div class="max-w-screen-2xl mx-auto px-4 py-2 flex items-center gap-4">
      <strong class="logo flex items-center gap-2 text-head font-bold">
        <span class="mark inline-block w-2.5 h-2.5 rounded-full bg-goldSand-deep" aria-hidden="true"></span>
        SKEIN · <span class="text-gradient-ocean">{{PROJ}}</span>
      </strong>

      <nav class="nav hidden md:flex items-center gap-1 ml-2" aria-label="主导航" data-nav-root>
        <a href="/dashboard" data-nav class="nav-tab tab-btn px-3 py-1.5 rounded-md text-sm font-medium">概览</a>
        <a href="/board"     data-nav class="nav-tab tab-btn px-3 py-1.5 rounded-md text-sm font-medium">看板</a>
        <a href="/queue"     data-nav class="nav-tab tab-btn px-3 py-1.5 rounded-md text-sm font-medium">队列</a>
        <a href="/task"      data-nav class="nav-tab tab-btn px-3 py-1.5 rounded-md text-sm font-medium">任务</a>
        <a href="/spec"      data-nav class="nav-tab tab-btn px-3 py-1.5 rounded-md text-sm font-medium">规范</a>
        <a href="/archive"   data-nav class="nav-tab tab-btn px-3 py-1.5 rounded-md text-sm font-medium">归档</a>
      </nav>

      <label class="search ml-auto flex items-center gap-2 px-3 py-1.5 rounded-md border border-brd bg-card/60">
        <span aria-hidden="true" class="text-muted">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="search" id="global-search" placeholder="搜索 id / 名称 / 描述…" autocomplete="off" aria-label="全局搜索" class="bg-transparent outline-none w-56 text-sm">
      </label>

      <button type="button" id="config-btn" class="icon-btn p-1.5 rounded-md text-muted hover:text-accent" aria-label="设置" title="设置">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

      <div class="theme-toggle flex items-center gap-1" role="group" aria-label="外观切换">
        <button type="button" data-theme-btn="light" class="p-1.5 rounded-md text-sm hover:bg-card/60" aria-label="浅色">☀</button>
        <button type="button" data-theme-btn="dark"  class="p-1.5 rounded-md text-sm hover:bg-card/60" aria-label="暗色">☾</button>
      </div>
    </div>
  </header>

  <!-- SPA 挂载点: router.js 动态 import ./pages/<name>.js → mod.render(mount, params, ctx) -->
  <main id="view" class="relative z-10 max-w-screen-2xl mx-auto px-4 py-6"></main>

  <!-- 回到顶部 fab (ponytail: 一个按钮带渐入, 无需组件库) -->
  <button type="button" id="fab-top" class="fab-top fixed bottom-6 right-6 z-float w-11 h-11 rounded-full glass border border-brd flex items-center justify-center text-accent opacity-0 pointer-events-none transition-opacity" aria-label="回到顶部" title="回到顶部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- ponytail: htm 是 2kb 极简 hyperscript tag; 用极简 h() 转 DOM (零 prestyle 依赖), 真"原生 DOM" -->
  <script type="module" src="./app.js"></script>
</body>
</html>
