<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKEIN · {{PROJ}}</title>

  <!-- 设计系统基底 -->
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../design.css">
  <!-- 图标: font-awesome 4.7 子集 (53 枚字形, 5KB woff2), 本地直出无外网请求 -->
  <link rel="stylesheet" href="../icons.css">
  <!-- Tailwind 预构建静态 css -->
  <link rel="stylesheet" href="../tailwind.css?v={{VER}}">
</head>
<body class="bg-fluid-dark min-h-screen font-sans text-fg transition-colors duration-500 ease-in-out">
  <!-- 早同步主题 (避免闪屏): localStorage 校验 → 默认 dark -->
  <script>
    (function () {
      var THEMES = ['light', 'dark'];
      var DEFAULT = 'dark';
      try {
        var pref = localStorage.getItem('skein-theme');
        if (!pref || THEMES.indexOf(pref) < 0) {
          pref = DEFAULT;
          localStorage.setItem('skein-theme', DEFAULT);
        }
        if (pref === 'dark') document.documentElement.setAttribute('data-theme', 'skein-dark');
        else document.documentElement.setAttribute('data-theme', 'skein-light');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'skein-dark');
      }
    })();
  </script>

  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" title="SKEIN">
        <div class="sidebar-logo"></div>
        <div class="sidebar-brand-text">
          <div class="sidebar-brand-title">SKEIN</div>
          <div class="sidebar-brand-sub">{{PROJ}}</div>
        </div>
      </div>

      <div class="sidebar-search">
        <input class="sidebar-search-input" id="menuSearch" type="text" placeholder="搜索菜单…" autocomplete="off" />
      </div>

      <div class="sidebar-scroll" id="sidebarScroll">
        <div class="sidebar-section-label">工作台</div>
        <a href="/dashboard" data-nav class="sidebar-item active" title="概览">
          <i class="fa fa-dashboard"></i>
          <span class="sidebar-item-text">概览</span>
        </a>
        <a href="/board" data-nav class="sidebar-item" title="看板">
          <i class="fa fa-sitemap"></i>
          <span class="sidebar-item-text">看板</span>
        </a>
        <a href="/queue" data-nav class="sidebar-item" title="队列">
          <i class="fa fa-list-ol"></i>
          <span class="sidebar-item-text">队列</span>
        </a>
        <a href="/tasks" data-nav class="sidebar-item" title="任务">
          <i class="fa fa-tasks"></i>
          <span class="sidebar-item-text">任务</span>
        </a>
        <a href="/spec" data-nav class="sidebar-item" title="规范">
          <i class="fa fa-file-text-o"></i>
          <span class="sidebar-item-text">规范</span>
        </a>
        <a href="/archive" data-nav class="sidebar-item" title="归档">
          <i class="fa fa-archive"></i>
          <span class="sidebar-item-text">归档</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <button type="button" id="theme-toggle-btn" class="sidebar-item" aria-label="切换主题" title="切换主题" style="margin-bottom:0">
          <i class="fa fa-moon-o dark:hidden"></i>
          <i class="fa fa-sun-o hidden dark:inline-block"></i>
          <span class="sidebar-item-text">切换主题</span>
        </button>
      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button type="button" id="menu-toggle" class="menu-toggle" aria-label="打开菜单">
          <i class="fa fa-bars"></i>
        </button>
        <nav class="antd-breadcrumb" aria-label="面包屑" id="topbarCrumb">
          <span class="current" id="pageTitle">看板</span>
        </nav>
        <div class="topbar-right">
          <button type="button" id="config-btn" class="icon-btn p-2 rounded-lg text-muted hover:text-accent hover:bg-accent/10 transition-colors" aria-label="设置" title="设置">
            <i class="fa fa-cog"></i>
          </button>
        </div>
      </header>

      <div class="content" id="view"></div>
    </main>
  </div>

  <!-- 回到顶部 fab -->
  <button type="button" id="fab-top" class="fab-top fixed bottom-6 right-6 z-float w-12 h-12 rounded-full glass border border-brd/60 flex items-center justify-center text-accent opacity-0 pointer-events-none transition-all hover-float hover:border-accent/50" aria-label="回到顶部" title="回到顶部">
    <i class="fa fa-chevron-up"></i>
  </button>

  <script type="module" src="./app.js"></script>
</body>
</html>
