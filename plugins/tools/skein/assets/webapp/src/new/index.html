<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SKEIN · {{PROJ}}</title>

  <!-- 设计系统基底: 16 色硬 token + 布局原语 + 动效; 早加载避免 FOUC -->
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../design.css">
  <!-- 图标: font-awesome 4.7 子集 (53 枚字形, 5KB woff2), 本地直出无外网请求 -->
  <link rel="stylesheet" href="../icons.css">
  <!-- Tailwind 预构建静态 css (原 cdn.tailwindcss.com 运行时 JIT, 省 ~400KB JS); 置于 design.css 后保持原级联顺序 -->
  <link rel="stylesheet" href="../tailwind.css?v={{VER}}">
</head>
<body class="bg-fluid-light min-h-screen font-sans text-fg transition-colors duration-500 ease-in-out">
  <!-- 早同步主题 (避免闪屏): localStorage 校验 → 默认 dark -->
  <script>
    (function () {
      var THEMES = ['light', 'dark'];
      var DEFAULT = 'dark';
      try {
        var pref = localStorage.getItem('skein-theme');
        if (!pref || THEMES.indexOf(pref) < 0) {
          pref = DEFAULT;
          localStorage.setItem('skein-theme', DEFAULT);
        }
        if (pref === 'dark') document.documentElement.setAttribute('data-theme', 'skein-dark');
        else document.documentElement.setAttribute('data-theme', 'skein-light');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'skein-dark');
      }
    })();
  </script>

  <!-- 顶栏: 玻璃横梁 + logo + 6 页 tab + search + theme toggle -->
  <header class="topbar sticky top-0 z-float glass border-b border-brd/60">
    <div class="max-w-screen-2xl mx-auto px-4 md:px-8 py-3 flex items-center gap-4">
      <strong class="logo flex items-center gap-2 text-head font-bold text-lg">
        <span class="mark inline-block w-3 h-3 rounded-full bg-goldSand-deep pulse-dot" aria-hidden="true"></span>
        SKEIN · <span class="text-gradient-ocean">{{PROJ}}</span>
      </strong>

      <nav class="nav hidden md:flex items-center gap-1 ml-4" aria-label="主导航" data-nav-root>
        <a href="/dashboard" data-nav class="nav-tab px-3 py-1.5 rounded-lg text-sm font-medium">概览</a>
        <a href="/board"     data-nav class="nav-tab px-3 py-1.5 rounded-lg text-sm font-medium">看板</a>
        <a href="/queue"     data-nav class="nav-tab px-3 py-1.5 rounded-lg text-sm font-medium">队列</a>
        <a href="/tasks"     data-nav class="nav-tab px-3 py-1.5 rounded-lg text-sm font-medium">任务</a>
        <a href="/spec"      data-nav class="nav-tab px-3 py-1.5 rounded-lg text-sm font-medium">规范</a>
        <a href="/archive"   data-nav class="nav-tab px-3 py-1.5 rounded-lg text-sm font-medium">归档</a>
      </nav>

      <label class="search ml-auto flex items-center gap-2 px-3 py-2 rounded-lg border border-brd/60 bg-card/60 hover:border-accent/40 transition-colors">
        <i class="fa fa-search text-muted text-sm"></i>
        <input type="search" id="global-search" placeholder="搜索 id / 名称 / 描述…" autocomplete="off" aria-label="全局搜索" class="bg-transparent outline-none w-56 text-sm">
      </label>

      <button type="button" id="config-btn" class="icon-btn p-2 rounded-lg text-muted hover:text-accent hover:bg-accent/10 transition-colors" aria-label="设置" title="设置">
        <i class="fa fa-cog"></i>
      </button>

      <button type="button" id="theme-toggle-btn" class="theme-toggle-btn glass rounded-full px-4 py-2 flex items-center gap-2 hover-float text-sm" aria-label="切换主题">
        <i class="fa fa-moon-o dark:hidden"></i>
        <i class="fa fa-sun-o hidden dark:inline-block"></i>
        <span class="hidden sm:inline">切换主题</span>
      </button>
    </div>
  </header>

  <!-- SPA 挂载点 -->
  <main id="view" class="relative z-10 max-w-screen-2xl mx-auto px-4 md:px-8 py-8"></main>

  <!-- 回到顶部 fab -->
  <button type="button" id="fab-top" class="fab-top fixed bottom-6 right-6 z-float w-12 h-12 rounded-full glass border border-brd/60 flex items-center justify-center text-accent opacity-0 pointer-events-none transition-all hover-float hover:border-accent/50" aria-label="回到顶部" title="回到顶部">
    <i class="fa fa-chevron-up"></i>
  </button>

  <script type="module" src="./app.js"></script>
</body>
</html>
